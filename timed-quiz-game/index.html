<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timed Math Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/script.js"></script>
</head>
<body>
    <main class="quiz-container">
        <h1>Timed Math Quiz</h1>
        <p>Test your math skills before time runs out!</p>

        <section class="settings">
            <h2>Choose an Operator</h2>

            <div class="operator-options">
                <button type="button" data-operator="+">+</button>
                <button type="button" data-operator="-">−</button>
                <button type="button" data-operator="*">×</button>
                <button type="button" data-operator="/">÷</button>
            </div>

            <h2>Choose Difficulty</h2>

            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>

            <button id="startButton" type="button">Start Game</button>
        </section>

        <section id="gameContainer" hidden>
            <p>Score: <span id="score">0</span></p>
            <p>Question: <span id="numberOfQuestions">1</span></p>
            <p>Time left: <span id="timer">0</span>s</p>
            
            <h2 id="question">Question will appear here</h2>
            <input
                type="number"
                id="answerInput"
                placeholder="Enter your answer"
            >
            <button id="submitButton" type="button">
                Submit Answer
            </button>
            <button id="playAgainButton" hidden>Play Again</button>
            <button id="nextQuestionButton" hidden>Next Question</button>
            <p id="feedback"></p>
        </section>
    </main>
</body>
</html>
